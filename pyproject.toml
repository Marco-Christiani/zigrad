[project]
name = "zigrad-a"
version = "0.1.0"
requires-python = ">=3.12.0,<3.13"
dependencies = [
    "flax>=0.12.3",
    # "jax[cuda12]>=0.8.2",
    "jax[cuda12-local]>=0.8.2",
    "plotly>=6.5.2",
    "polars>=1.37.1",
    "ruff>=0.14.14",
    "transformers<5.0.0",
    # torch: excluded from devshell - CUDA version conflicts with JAX.
    "connectorx>=0.4.5",
    "pyarrow>=23.0.0",
    # TVM MetaSchedule dependencies
    "cloudpickle>=3.0.0",
    "xgboost>=2.0.0",
    "psutil>=5.9.0",
    "scikit-learn>=1.8.0",
    "flatbuffers>=25.12.19",
    "pyelftools>=0.32",
]

