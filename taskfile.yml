# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  RED:
    sh: tput setaf 1
  RSYNC_BASE: >-
    rsync -avz
    -e "{{.RSYNC_SSH | default "ssh"}}"
    --checksum
    --no-perms
    --no-owner
    --no-group
    --no-times
    --filter=':- .rsync-filter'
  # using this for now, abs paths may an issue, removed previous dynamic logic
  ZG_EXTERNAL_SDK_ROOT: ./result
  PJRT_PLUGIN_PATH:
    sh: |
      set -e
      p="${PJRT_PLUGIN_PATH:-{{.ZG_EXTERNAL_SDK_ROOT}}/runtime/xla/pjrt/c/pjrt_c_api_gpu_plugin.so}"
      # realpath "$p" 2>/dev/null || exit 1
      echo "$p"

dotenv: [".env"]
# env:
#   PJRT_PLUGIN_PATH: ZG_EXTERNAL_SDK_ROOT/runtime/jax_plugins/xla_cuda13/xla_cuda_plugin.so
#   # sh: realpath zig-out/runtime/jax_plugins/xla_cuda13/xla_cuda_plugin.so

tasks:
  task_timer:
    # https://github.com/go-task/task/discussions/1479#discussioncomment-12007037
    desc: "Calculate timing of the calling task"
    # Call this task at the end of the caller task with following parameters:
    #   - task: task_timer
    #     vars:
    #       start_time: '{{ now | unixEpoch }}'
    summary: |
      This task is a helper task to calulate the duration in seconds
      for the caller task
    vars:
      end_time: '{{now | unixEpoch}}'
    requires:
      vars: [start_time]
    cmds:
      - 'tmux display-message "{{.CLI_ARGS }} elapsed={{ sub .end_time .start_time | duration }}"'
    silent: true
    internal: true
  sdk-devel:
    cmds:
      - nix build .#zigrad-external-sdk-devel --print-out-paths
      - direnv reload
      - task: task_timer
        vars:
          start_time: '{{ now | unixEpoch }}'

  check-sdk:
    cmd: uv run ./scripts/check_sdk.py {{.CLI_ARGS}}
    vars:
      # default args to support overriding completely
      CLI_ARGS: --sdk-root {{.ZG_EXTERNAL_SDK_ROOT}}
    requires:
      vars: [ZG_EXTERNAL_SDK_ROOT]

  build:
    cmd: zig build -Dsdk={{.ZG_EXTERNAL_SDK_ROOT}}
    requires:
      vars: [ZG_EXTERNAL_SDK_ROOT]

  test:
    cmd: zig build -Dsdk={{.ZG_EXTERNAL_SDK_ROOT}} test
    requires:
      vars: [ZG_EXTERNAL_SDK_ROOT]

  m2:
    deps: [build]
    cmd: ./zig-out/bin/zigrad-pjrt-m2
    env:
      PJRT_PLUGIN_PATH: "{{.PJRT_PLUGIN_PATH}}"
    requires:
      vars: [PJRT_PLUGIN_PATH]

  m2-fusion:
    deps: [build]
    cmd: ./zig-out/bin/zigrad-pjrt-m2-fusion
    env:
      PJRT_PLUGIN_PATH: "{{.PJRT_PLUGIN_PATH}}"
    requires:
      vars: [PJRT_PLUGIN_PATH]

  m4:
    deps: [build]
    cmd: ./zig-out/bin/zigrad-pjrt-m4
    env:
      PJRT_PLUGIN_PATH: "{{.PJRT_PLUGIN_PATH}}"
    requires:
      vars: [PJRT_PLUGIN_PATH]

  m4-custom:
    deps: [build]
    cmd: ./zig-out/bin/zigrad-pjrt-m4-custom
    env:
      PJRT_PLUGIN_PATH: "{{.PJRT_PLUGIN_PATH}}"
    requires:
      vars: [PJRT_PLUGIN_PATH]

  # Meta Utils =================================================================
  # Nix ccache -----------------------------------------------------------------
  nix-ccache-setup:
    cmds:
      - sudo mkdir -m0770 -p /nix/var/cache/ccache
      - sudo chown --reference=/nix/store /nix/var/cache/ccache
      - |
        before=$(stat -c %Y /etc/nix/nix.custom.conf)
        sudo sed -i '/^extra-sandbox-paths = \/nix\/var\/cache\/ccache$/!{
        $a\
        extra-sandbox-paths = /nix/var/cache/ccache
        }' /etc/nix/nix.custom.conf
        after=$(stat -c %Y /etc/nix/nix.conf)
        [ "$before" != "$after" ] && echo "nix conf changed, restart daemon."

  nix-ccache:
    cmd: sudo $(which nix) run .#ccache -- --dir /nix/var/cache/ccache {{.CLI_ARGS}}

  nix-ccache:increase-size:
    cmd:
      task: nix-ccache
      vars:
        CLI_ARGS: --max-size 50G

  nix-ccache:stats:
    cmd:
      task: nix-ccache
      vars:
        CLI_ARGS: --show-stats

  nix-ccache:bundle:
    cmd: |
      sudo tar \
        --numeric-owner \
        --xattrs --acls \
        --exclude='./tmp' \
        --exclude='./lock' \
        -C /nix/var/cache \
        -czf /tmp/ccache-seed.tgz ccache

  nix-ccache:populate:
    cmds:
      - sudo mkdir -p /nix/var/cache/ccache
      - sudo tar --numeric-owner --xattrs --acls -C /nix/var/cache -xzf ccache-seed.tgz

  # Nix bazel cache ------------------------------------------------------------
  nix-bazel-cache-setup:
    cmds:
      - sudo mkdir -m0770 -p /nix/var/cache/bazel
      - sudo chown --reference=/nix/store /nix/var/cache/bazel
      - |
        before=$(stat -c %Y /etc/nix/nix.custom.conf)
        sudo sed -i '/^extra-sandbox-paths = \/nix\/var\/cache\/bazel$/!{
        $a\
        extra-sandbox-paths = /nix/var/cache/bazel
        }' /etc/nix/nix.custom.conf
        after=$(stat -c %Y /etc/nix/nix.conf)
        [ "$before" != "$after" ] && echo "nix conf changed, restart daemon."

  nix-bazel-cache:usage:
    cmd: sudo du -sh /nix/var/cache/bazel

  # Rsync ----------------------------------------------------------------------
  sync:push:
    desc: "Sync local -> remote (no deletes)"
    cmds:
      - |
        {{.RSYNC_BASE}} {{.CLI_ARGS}} --progress ./ {{.REMOTE}}/
    requires:
      vars: [REMOTE]

  sync:pull:
    desc: "Sync remote -> local (no deletes)"
    cmds:
      - |
        {{.RSYNC_BASE}} {{.CLI_ARGS}} --progress {{.REMOTE}}:/ ./
    requires:
      vars: [REMOTE]

  sync:push:mirror:
    desc: "Mirror local -> remote (DELETES remote files)"
    cmds:
      - |
        {{.RSYNC_BASE}} {{.CLI_ARGS}} --progress --delete ./ {{.REMOTE}}/
    requires:
      vars: [REMOTE]

  sync:push:dry:
    desc: "Dry-run local -> remote (optional verbose output)"
    vars:
      VERBOSE: '{{.VERBOSE | default "off"}}'
      RSYNC_VERBOSE_FLAGS: >-
        {{if eq .VERBOSE "on"}}--itemize-changes --human-readable{{end}}
    requires:
      vars:
        - REMOTE
        - name: VERBOSE
          enum: [off, on]
    cmds:
      - |
        {{.RSYNC_BASE}} --dry-run {{.RSYNC_VERBOSE_FLAGS}} ./ {{.REMOTE}}/

  sync:pull:dry:
    desc: "Dry-run remote -> local (optional verbose output)"
    vars:
      VERBOSE: '{{.VERBOSE | default "off"}}'
      RSYNC_VERBOSE_FLAGS: >-
        {{if eq .VERBOSE "on"}}--itemize-changes --human-readable{{end}}
    requires:
      vars:
        - REMOTE
        - name: VERBOSE
          enum: [off, on]
    cmds:
      - |
        {{.RSYNC_BASE}} --dry-run {{.RSYNC_VERBOSE_FLAGS}}  {{.REMOTE}}:/ ./
