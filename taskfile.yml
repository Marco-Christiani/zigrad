# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

silent: true

vars:
  RED: "\\033[31m"
  GREEN: "\\033[32m"
  YELLOW: "\\033[33m"
  RESET: "\\033[0m"
  RSYNC_BASE: >-
    rsync -avz
    -e "{{.RSYNC_SSH | default "ssh"}}"
    --checksum
    --no-perms
    --no-owner
    --no-group
    --no-times
    --filter=':- .rsync-filter'
  ZG_EXTERNAL_SDK_ROOT: '{{env "ZG_EXTERNAL_SDK_ROOT" | default "./result"}}'
  ZG_RUNTIME_SDK_ROOT: '{{env "ZG_RUNTIME_SDK_ROOT" | default .ZG_EXTERNAL_SDK_ROOT}}'
  XLA_FLAGS_EXTRA: '{{env "ZG_XLA_FLAGS_EXTRA" | default ""}}'

env:
  ZG_EXTERNAL_SDK_ROOT: "{{.ZG_EXTERNAL_SDK_ROOT}}"
  ZG_RUNTIME_SDK_ROOT: "{{.ZG_RUNTIME_SDK_ROOT}}"
  PJRT_CPU_PLUGIN_PATH: "{{.ZG_RUNTIME_SDK_ROOT}}/runtime/xla/pjrt/c/pjrt_c_api_cpu_plugin.so"
  PJRT_GPU_PLUGIN_PATH: "{{.ZG_RUNTIME_SDK_ROOT}}/runtime/xla/pjrt/c/pjrt_c_api_gpu_plugin.so"
  PJRT_PLUGIN_PATH: "{{.ZG_RUNTIME_SDK_ROOT}}/runtime/xla/pjrt/c/pjrt_c_api_gpu_plugin.so"
  # Perf default: enable the fusion block-level rewriter so XLA can emit Triton softmax fusions.
  XLA_FLAGS: "--xla_gpu_cuda_data_dir={{.ZG_RUNTIME_SDK_ROOT}}/runtime/nvidia --xla_gpu_experimental_enable_fusion_block_level_rewriter=true {{.XLA_FLAGS_EXTRA}}"
  # intentionally unset this
  NIX_CFLAGS_COMPILE: ""

dotenv: [".env"]
# env:
#   PJRT_PLUGIN_PATH: ZG_EXTERNAL_SDK_ROOT/runtime/jax_plugins/xla_cuda13/xla_cuda_plugin.so
#   # sh: realpath zig-out/runtime/jax_plugins/xla_cuda13/xla_cuda_plugin.so

tasks:
  task_timer:
    # https://github.com/go-task/task/discussions/1479#discussioncomment-12007037
    desc: "Calculate timing of the calling task"
    # Call this task at the end of the caller task with following parameters:
    #   - task: task_timer
    #     vars:
    #       start_time: '{{ now | unixEpoch }}'
    summary: |
      This task is a helper task to calulate the duration in seconds
      for the caller task
    vars:
      end_time: "{{now | unixEpoch}}"
    requires:
      vars: [start_time]
    cmds:
      - 'tmux display-message "{{.CLI_ARGS }} elapsed={{ sub .end_time .start_time | duration }}"'
    silent: true
    internal: true
  sdk:
    desc: Build full SDK (compile + runtime) and reload direnv
    cmds:
      - nix build .#zigrad-sdk-full-gpu --print-out-paths {{.CLI_ARGS}}
      - direnv reload
      - task: task_timer
        vars:
          start_time: "{{ now | unixEpoch }}"

  sdk:compile:
    desc: Build compile-time SDK profile (headers/libs)
    cmd: nix build .#zigrad-sdk-full-gpu-compile --print-out-paths {{.CLI_ARGS}}

  sdk:runtime:
    desc: Build runtime SDK profile (PJRT plugins + TVM DSOs + CUDA redist)
    cmd: nix build .#zigrad-sdk-full-gpu-runtime --print-out-paths {{.CLI_ARGS}}

  check-sdk:
    cmd:
      task: python
      vars:
        CLI_ARGS: scripts/check_sdk.py {{.CLI_ARGS}}
    vars:
      # default args to support overriding completely
      CLI_ARGS: --sdk-root $ZG_EXTERNAL_SDK_ROOT

  _check-env:
    silent: true
    internal: true
    requires:
      vars:
        - name: MODE
          enum: [build, run]
    cmd: |
      ZG_EXTERNAL_SDK_ROOT=${ZG_EXTERNAL_SDK_ROOT:-'<not-set>'}
      check_env_path(){
        local name="$1"
        local val="${!name}"
        if ! realpath "$val" > /dev/null 2>&1; then
          printf "%b[WARNING] $name=$val does not exist%b\n" "{{.YELLOW}}" "{{.RESET}}"
          return 1
        else
          printf "%b[OK] $name=$val%b\n" "{{.GREEN}}" "{{.RESET}}"
          return 0
        fi
      }
      status=0
      {{if eq .MODE "build"}}check_env_path "ZG_EXTERNAL_SDK_ROOT" || status=1{{end}}
      {{if eq .MODE "run"}}check_env_path "PJRT_PLUGIN_PATH" || status=1{{end}}
      exit $status

  check-env-bt:
    # silent: true
    cmd:
      task: _check-env
      vars:
        MODE: build

  check-env-rt:
    silent: true
    cmd:
      task: _check-env
      vars:
        MODE: run

  build:
    deps: [check-env-bt]
    cmd: zig build -Doptimize={{ .CLI_ARGS | default "ReleaseFast" }} -Dsdk=$ZG_EXTERNAL_SDK_ROOT -Dinstall-runtime-link=true

  test:
    cmd: zig build -Dsdk=$ZG_EXTERNAL_SDK_ROOT test

  docs:
    desc: Emit Zig autodocs to zig-out/autodoc
    deps: [check-env-bt]
    cmd: zig build -Dsdk=$ZG_EXTERNAL_SDK_ROOT docs

  docs:web:
    desc: Emit Zig autodocs and sync website/nuxt-content/public/api
    deps: [check-env-bt]
    cmd: ./website/nuxt-content/scripts/prepare-zig-autodoc-web.sh

  site:install:
    desc: Install Nuxt site dependencies
    dir: website/nuxt-content
    cmd: npm install

  site:dev:
    desc: Sync autodocs, then run Nuxt dev server
    deps: [docs:web]
    dir: website/nuxt-content
    cmd: npm run dev

  site:build:
    desc: Sync autodocs, then build static Nuxt site
    deps: [docs:web]
    dir: website/nuxt-content
    cmd: npx nuxt generate

  deps:zig:refresh:
    desc: Regenerate nix/build.zig.zon.nix from build.zig.zon
    cmd: zon2nix build.zig.zon > nix/build.zig.zon.nix

  deps:zig:check:
    desc: Verify nix/build.zig.zon.nix matches build.zig.zon
    cmd: |
      set -euo pipefail
      tmp="$(mktemp)"
      trap 'rm -f "$tmp"' EXIT
      zon2nix build.zig.zon > "$tmp"
      if ! diff -u nix/build.zig.zon.nix "$tmp"; then
        echo "Zig deps Nix file is out of date. Run: task deps:zig:refresh" >&2
        exit 1
      fi

  test:tvm-runtime-gating:
    desc: Run flake checks for TVM runtime gating
    cmds:
      - nix build .#checks.tvm-runtime-full-ffi {{.CLI_ARGS}}
      - nix build .#checks.tvm-runtime-no-tvm {{.CLI_ARGS}}

  check:flake:
    desc: Run full flake checks
    cmd: nix flake check {{.CLI_ARGS}}

  check:tvm-runtime:host:
    desc: Run host integration check for full TVM compiler load
    cmd: nix run .#tvm-runtime-full-compiler-host-check -- {{.CLI_ARGS}}

  run:
    deps: [build, check-env-rt]
    cmd: ./zig-out/bin/zigrad {{.CLI_ARGS}}

  run:cpu:
    deps: [build]
    cmds:
      - |
        if [ -z "${PJRT_CPU_PLUGIN_PATH:-}" ]; then
          echo "PJRT_CPU_PLUGIN_PATH is not set (run inside the devshell)."
          exit 1
        fi
        PJRT_PLUGIN_PATH="$PJRT_CPU_PLUGIN_PATH" ./zig-out/bin/zigrad {{.CLI_ARGS}}
  run:cpu:dump-hlo:
    deps: [build]
    vars:
      DUMP_DIR: '{{.DUMP_DIR | default "/tmp/zigrad_hlo_cpu"}}'
      CLI_ARGS: '{{.CLI_ARGS | default "train-demo 1"}}'
    cmds:
      - |
        if [ -z "${PJRT_CPU_PLUGIN_PATH:-}" ]; then
          echo "PJRT_CPU_PLUGIN_PATH is not set (run inside the devshell)."
          exit 1
        fi
        PJRT_PLUGIN_PATH="$PJRT_CPU_PLUGIN_PATH" \
          XLA_FLAGS="--xla_dump_to={{.DUMP_DIR}} --xla_dump_hlo_as_text --xla_dump_hlo_pass_re=.*" \
          ./zig-out/bin/zigrad {{.CLI_ARGS}}
  profile:cpu:
    desc: "Collect perf profile for Zigrad CPU train demo"
    deps: [build]
    vars:
      PERF_DATA: '{{.PERF_DATA | default "/tmp/zigrad_perf_cpu.data"}}'
      PROFILE_ARGS: '{{.PROFILE_ARGS | default "train-demo 1"}}'
      PERF_DELAY_MS: '{{.PERF_DELAY_MS | default "0"}}'
    cmds:
      - |
        if [ -z "${PJRT_CPU_PLUGIN_PATH:-}" ]; then
          echo "PJRT_CPU_PLUGIN_PATH is not set (run inside the devshell)."
          exit 1
        fi
        nix shell nixpkgs#perf -c bash -lc \
          'env PJRT_PLUGIN_PATH="'"$PJRT_CPU_PLUGIN_PATH"'" perf record -F 99 -g -D {{.PERF_DELAY_MS}} -o {{.PERF_DATA}} -- ./zig-out/bin/zigrad {{.PROFILE_ARGS}} > /tmp/zigrad_perf_cpu_stdout.log 2>/tmp/zigrad_perf_cpu_stderr.log'
  profile:cpu:report:
    desc: "Report perf profile for Zigrad CPU train demo"
    vars:
      PERF_DATA: '{{.PERF_DATA | default "/tmp/zigrad_perf_cpu.data"}}'
    cmds:
      - |
        nix shell nixpkgs#perf -c bash -lc \
          'perf report --stdio -n --percent-limit 1 -i {{.PERF_DATA}} | head -n 80'
  profile:jax:cpu:
    desc: "Collect perf profile for JAX CPU train demo"
    vars:
      PERF_DATA: '{{.PERF_DATA | default "/tmp/jax_perf_cpu.data"}}'
      PERF_DELAY_MS: '{{.PERF_DELAY_MS | default "0"}}'
      PROFILE_ARGS: '{{.PROFILE_ARGS | default "--warmup 10 --steps 2000"}}'
    cmds:
      - |
        nix shell nixpkgs#perf -c bash -lc \
          'JAX_PLATFORMS=cpu perf record -F 99 -g -D {{.PERF_DELAY_MS}} -o {{.PERF_DATA}} -- /run/current-system/sw/bin/nix develop .#default --command python scripts/jax_train_demo.py {{.PROFILE_ARGS}} > /tmp/jax_perf_cpu_stdout.log 2>/tmp/jax_perf_cpu_stderr.log'
  profile:jax:cpu:report:
    desc: "Report perf profile for JAX CPU train demo"
    vars:
      PERF_DATA: '{{.PERF_DATA | default "/tmp/jax_perf_cpu.data"}}'
    cmds:
      - |
        nix shell nixpkgs#perf -c bash -lc \
          'perf report --stdio -n --percent-limit 1 -i {{.PERF_DATA}} | head -n 80'

  run:gpu:
    deps: [build]
    cmds:
      - |
        if [ -z "${PJRT_GPU_PLUGIN_PATH:-}" ]; then
          echo "PJRT_GPU_PLUGIN_PATH is not set (run inside the devshell)."
          exit 1
        fi
        PJRT_PLUGIN_PATH="$PJRT_GPU_PLUGIN_PATH" ./zig-out/bin/zigrad {{.CLI_ARGS}}
  run:gpu:dump-hlo:
    deps: [build]
    vars:
      DUMP_DIR: '{{.DUMP_DIR | default "/tmp/zigrad_hlo_gpu"}}'
      CLI_ARGS: '{{.CLI_ARGS | default "train-demo 1"}}'
    cmds:
      - |
        if [ -z "${PJRT_GPU_PLUGIN_PATH:-}" ]; then
          echo "PJRT_GPU_PLUGIN_PATH is not set (run inside the devshell)."
          exit 1
        fi
        PJRT_PLUGIN_PATH="$PJRT_GPU_PLUGIN_PATH" \
          XLA_FLAGS="--xla_gpu_cuda_data_dir=$ZG_EXTERNAL_SDK_ROOT/runtime/nvidia --xla_gpu_experimental_enable_fusion_block_level_rewriter=true --xla_dump_to={{.DUMP_DIR}} --xla_dump_hlo_as_text --xla_dump_hlo_pass_re=.*" \
          ./zig-out/bin/zigrad {{.CLI_ARGS}}

  custom-call:neg:
    cmd:
      task: run
      vars:
        CLI_ARGS: custom-call-neg

  custom-call:neg:cpu:
    cmd:
      task: run:cpu
      vars:
        CLI_ARGS: custom-call-neg

  custom-call:neg:gpu:
    cmd:
      task: run:gpu
      vars:
        CLI_ARGS: custom-call-neg

  vjp-demo:
    cmd:
      task: run
      vars:
        CLI_ARGS: vjp-demo

  vjp-demo:cpu:
    cmd:
      task: run:cpu
      vars:
        CLI_ARGS: vjp-demo

  vjp-demo:gpu:
    cmd:
      task: run:gpu
      vars:
        CLI_ARGS: vjp-demo

  # IREE deployment flow ===========================================================
  iree:build:
    desc: "Build zigrad with IREE backend enabled"
    deps: [check-env-bt]
    cmd: zig build -Diree-backend=true -Dsdk=$ZG_EXTERNAL_SDK_ROOT

  iree:demo:
    desc: "Run the IREE AOT compile+execute demo (all-in-one)"
    deps: [iree:build]
    cmd: |
      IREE_COMPILE_EXE="${IREE_COMPILE_EXE:-result/bin/iree-compile}" \
        ./zig-out/bin/zigrad iree-aot-demo {{.CLI_ARGS}}

  iree:compile:
    desc: "Compile demo program to VMFB (offline, no runtime needed)"
    deps: [iree:build]
    cmd: |
      IREE_COMPILE_EXE="${IREE_COMPILE_EXE:-result/bin/iree-compile}" \
        ./zig-out/bin/zigrad iree-aot-compile {{.CLI_ARGS}}

  iree:runner:build:
    desc: "Build minimal IREE VMFB runner (ReleaseSmall)"
    cmd: zig build iree-runner -Diree-backend=true -Dsdk=$ZG_EXTERNAL_SDK_ROOT -Doptimize=ReleaseSmall

  iree:runner:run:
    desc: "Execute a VMFB with the minimal runner"
    deps: [iree:runner:build]
    cmd: ./zig-out/bin/iree-runner {{.CLI_ARGS | default "demo.vmfb"}}

  # Shim (MLIR dialect/pass development) ======================================
  shim:build:
    desc: Rebuild the MLIR extension shim locally (auto-configures on first run)
    cmd: |
      if [ ! -f shim/build/build.ninja ]; then
        cmake -G Ninja -S shim -B shim/build \
          -DZG_SDK_INCLUDE=$ZG_EXTERNAL_SDK_ROOT/include \
          -DZG_SDK_LIB=$ZG_EXTERNAL_SDK_ROOT/lib
      fi
      cmake --build shim/build

  shim:test:
    desc: Run all MLIR pass tests via mlir-opt
    deps: [shim:build]
    cmd: |
      ZG_EXT=shim/build/libzigrad_mlir_ext.so
      MLIR_OPT=result-llvm/bin/mlir-opt
      PLUGIN="--load-dialect-plugin=$ZG_EXT --load-pass-plugin=$ZG_EXT"
      failed=0
      for f in shim/test/select_*.mlir; do
        echo "=== $f ==="
        $MLIR_OPT $PLUGIN --pass-pipeline="builtin.module(func.func(zg-mirage-kernel-select))" "$f" || failed=1
      done
      for f in shim/test/legalize*.mlir shim/test/expand_*.mlir; do
        [ -f "$f" ] || continue
        pass=$(head -1 "$f" | sed -n 's|^// RUN-PIPELINE: ||p')
        [ -n "$pass" ] || continue
        echo "=== $f ==="
        $MLIR_OPT $PLUGIN --pass-pipeline="$pass" "$f" || failed=1
      done
      exit $failed

  shim:opt:
    desc: "Run mlir-opt with zigrad plugin. Usage: task shim:opt -- --pass-pipeline='...' file.mlir"
    cmd: |
      result-llvm/bin/mlir-opt \
        --load-dialect-plugin=shim/build/libzigrad_mlir_ext.so \
        --load-pass-plugin=shim/build/libzigrad_mlir_ext.so \
        {{.CLI_ARGS}}

  # Meta Utils =================================================================
  python:
    desc: Run a python command in the devshell (in lieu of uv on NixOS). E.g., `task python -- scripts/reference_experiments.py`
    cmds:
      - nix develop .#default --command python {{.CLI_ARGS | default "scripts/reference_experiments.py"}}
  jax:dump-hlo:gpu:
    desc: Run the JAX train demo and dump HLO (GPU).
    vars:
      DUMP_DIR: '{{.DUMP_DIR | default "/tmp/jax_hlo_gpu"}}'
      CLI_ARGS: '{{.CLI_ARGS | default "--warmup=1"}}'
    cmd:
      task: python
      vars:
        CLI_ARGS: >-
          -c "import os, runpy, sys; os.environ['XLA_FLAGS']='--xla_gpu_cuda_data_dir={{.ZG_EXTERNAL_SDK_ROOT}}/runtime/nvidia --xla_dump_to={{.DUMP_DIR}} --xla_dump_hlo_as_text --xla_dump_hlo_pass_re=.*'; sys.argv=['scripts/jax_train_demo.py'] + '{{.CLI_ARGS}}'.split(); runpy.run_path('scripts/jax_train_demo.py', run_name='__main__')"
  jax:dump-hlo:cpu:
    desc: Run the JAX train demo and dump HLO (CPU).
    vars:
      DUMP_DIR: '{{.DUMP_DIR | default "/tmp/jax_hlo_cpu"}}'
      CLI_ARGS: '{{.CLI_ARGS | default "--warmup=1"}}'
    cmd:
      task: python
      vars:
        CLI_ARGS: >-
          -c "import os, runpy, sys; os.environ['JAX_PLATFORM_NAME']='cpu'; os.environ['XLA_FLAGS']='--xla_dump_to={{.DUMP_DIR}} --xla_dump_hlo_as_text --xla_dump_hlo_pass_re=.*'; sys.argv=['scripts/jax_train_demo.py'] + '{{.CLI_ARGS}}'.split(); runpy.run_path('scripts/jax_train_demo.py', run_name='__main__')"

  # Nix ccache -----------------------------------------------------------------
  nix-ccache-setup:
    cmds:
      - sudo mkdir -m0770 -p /nix/var/cache/ccache
      - sudo chown --reference=/nix/store /nix/var/cache/ccache
      - task: _nix-cache-setup
        vars:
          path: /nix/var/cache/ccache

  nix-ccache:
    cmd: sudo $(which nix) run .#ccache -- --dir /nix/var/cache/ccache {{.CLI_ARGS}}

  nix-ccache:increase-size:
    cmd:
      task: nix-ccache
      vars:
        CLI_ARGS: --max-size 50G

  nix-ccache:stats:
    cmd:
      task: nix-ccache
      vars:
        CLI_ARGS: --show-stats

  nix-ccache:bundle:
    cmd: |
      sudo tar \
        --numeric-owner \
        --xattrs --acls \
        --exclude='./tmp' \
        --exclude='./lock' \
        -C /nix/var/cache \
        -czf /tmp/ccache-seed.tgz ccache

  nix-ccache:populate:
    cmds:
      - sudo mkdir -p /nix/var/cache/ccache
      - sudo tar --numeric-owner --xattrs --acls -C /nix/var/cache -xzf ccache-seed.tgz

  _nix-cache-setup:
    internal: true
    cmd: |
      file=/etc/nix/nix.custom.conf
      path="{{.path}}"
      line="extra-sandbox-paths = $path"

      # ensure file exists
      sudo touch "$file"

      before=$(sha256sum "$file" | cut -d' ' -f1)

      # append only if the path is not already present on any extra-sandbox-paths line
      if ! grep -Eq '^[[:space:]]*extra-sandbox-paths[[:space:]]*=.*(^|[[:space:]])'"$path"'([[:space:]]|$)' "$file"; then
        echo "$line" | sudo tee -a "$file" >/dev/null
      fi

      after=$(sha256sum "$file" | cut -d' ' -f1)

      if [ "$before" != "$after" ]; then
        echo "nix conf changed, restart daemon."
      fi

  # Nix bazel cache ------------------------------------------------------------
  nix-bazel-cache-setup:
    cmds:
      - sudo mkdir -m0770 -p /nix/var/cache/bazel
      - sudo chown --reference=/nix/store /nix/var/cache/bazel
      - task: _nix-cache-setup
        vars:
          path: /nix/var/cache/bazel

  nix-bazel-cache:usage:
    cmd: sudo du -sh /nix/var/cache/bazel

  # Rsync ----------------------------------------------------------------------
  sync:push:
    desc: "Sync local -> remote (no deletes)"
    cmds:
      - |
        {{.RSYNC_BASE}} {{.CLI_ARGS}} --progress ./ {{.REMOTE}}/
    requires:
      vars: [REMOTE]

  sync:pull:
    desc: "Sync remote -> local (no deletes)"
    cmds:
      - |
        {{.RSYNC_BASE}} {{.CLI_ARGS}} --progress {{.REMOTE}}:/ ./
    requires:
      vars: [REMOTE]

  sync:push:mirror:
    desc: "Mirror local -> remote (DELETES remote files)"
    cmds:
      - |
        {{.RSYNC_BASE}} {{.CLI_ARGS}} --progress --delete ./ {{.REMOTE}}/
    requires:
      vars: [REMOTE]

  sync:push:dry:
    desc: "Dry-run local -> remote (optional verbose output)"
    vars:
      VERBOSE: '{{.VERBOSE | default "off"}}'
      RSYNC_VERBOSE_FLAGS: >-
        {{if eq .VERBOSE "on"}}--itemize-changes --human-readable{{end}}
    requires:
      vars:
        - REMOTE
        - name: VERBOSE
          enum: [off, on]
    cmds:
      - |
        {{.RSYNC_BASE}} --dry-run {{.RSYNC_VERBOSE_FLAGS}} ./ {{.REMOTE}}/

  sync:pull:dry:
    desc: "Dry-run remote -> local (optional verbose output)"
    vars:
      VERBOSE: '{{.VERBOSE | default "off"}}'
      RSYNC_VERBOSE_FLAGS: >-
        {{if eq .VERBOSE "on"}}--itemize-changes --human-readable{{end}}
    requires:
      vars:
        - REMOTE
        - name: VERBOSE
          enum: [off, on]
    cmds:
      - |
        {{.RSYNC_BASE}} --dry-run {{.RSYNC_VERBOSE_FLAGS}}  {{.REMOTE}}:/ ./

  bench-grid:
    cmds:
      - | # GPU
        shape0=1024x1024x1024
        time ./zig-out/bin/zigrad tvm-tune --shape=$shape0 --cuda --work-dir=artifacts/tvm_cache/cuda/$shape0 2>&1 | grep -v warning
        shape1=32768x1024x1024
        time ./zig-out/bin/zigrad tvm-tune --shape=$shape1 --cuda --work-dir=artifacts/tvm_cache/cuda/$shape1 2>&1 | grep -v warning
        ./zig-out/bin/zigrad benchmark --shapes=$shape0,$shape1 --impls=tvm_gpu,xla_gpu
      - | # CPU
        shape0=1024x1024x1024
        time ./zig-out/bin/zigrad tvm-tune --shape=$shape0 --work-dir=artifacts/tvm_cache/cpu/$shape0 2>&1 | grep -v warning
        shape1=32768x1024x1024
        time ./zig-out/bin/zigrad tvm-tune --shape=$shape1 --work-dir=artifacts/tvm_cache/cpu/$shape1 2>&1 | grep -v warning
        ./zig-out/bin/zigrad benchmark --shapes=$shape0,$shape1 --impls=tvm_cpu,xla_cpu

  bench-tvm-mkl-attn-block:
    cmds:
      - time ./zig-out/bin/zigrad tvm-tune-attention --shape=4x32x2048 --trials=64 --cpu
      - time ./zig-out/bin/zigrad tvm-run-attention-cpu --shape=4x32x2048

  bench-tvm-mkl-attn:
    desc: "Benchmark TVM attention with fresh tuning and backup/restore workflow"
    deps: [build]
    vars:
      SHAPE: '{{.SHAPE | default "32x2048x128"}}'
      TRIALS: '{{.TRIALS | default "64"}}'
    cmds:
      - scripts/bench_tvm_attention.sh --shape={{.SHAPE}} --trials={{.TRIALS}}
  # polly:zig:
  #   cmds:
  #     - zig build -Doptimize=ReleaseFast
  #     -
  #       exe.getEmittedLlvmIr
  #       zig build-exe "$ZIG_SOURCE" \
  #         -OReleaseFast \
  #         -femit-llvm-ir \
  #         -fno-emit-bin \
  #         -fno-emit-h \
  #         --name "${RAW_LL/\.ll/}"
