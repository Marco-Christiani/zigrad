# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

silent: true

vars:
  RED: "\\033[31m"
  GREEN: "\\033[32m"
  YELLOW: "\\033[33m"
  RESET: "\\033[0m"
  RSYNC_BASE: >-
    rsync -avz
    -e "{{.RSYNC_SSH | default "ssh"}}"
    --checksum
    --no-perms
    --no-owner
    --no-group
    --no-times
    --filter=':- .rsync-filter'
  ZG_EXTERNAL_SDK_ROOT: '{{env "ZG_EXTERNAL_SDK_ROOT"}}'
  ZG_RUNTIME_SDK_ROOT: '{{env "ZG_RUNTIME_SDK_ROOT" | default .ZG_EXTERNAL_SDK_ROOT}}'

env:
  ZG_EXTERNAL_SDK_ROOT: "{{.ZG_EXTERNAL_SDK_ROOT}}"
  ZG_RUNTIME_SDK_ROOT: "{{.ZG_RUNTIME_SDK_ROOT}}"

dotenv: [".env"]
# env:
#   PJRT_PLUGIN_PATH: ZG_EXTERNAL_SDK_ROOT/runtime/jax_plugins/xla_cuda13/xla_cuda_plugin.so
#   # sh: realpath zig-out/runtime/jax_plugins/xla_cuda13/xla_cuda_plugin.so

tasks:
  task_timer:
    # https://github.com/go-task/task/discussions/1479#discussioncomment-12007037
    desc: "Calculate timing of the calling task"
    # Call this task at the end of the caller task with following parameters:
    #   - task: task_timer
    #     vars:
    #       start_time: '{{ now | unixEpoch }}'
    summary: |
      This task is a helper task to calulate the duration in seconds
      for the caller task
    vars:
      end_time: "{{now | unixEpoch}}"
    requires:
      vars: [start_time]
    cmds:
      - 'tmux display-message "{{.CLI_ARGS }} elapsed={{ sub .end_time .start_time | duration }}"'
    silent: true
    internal: true
  sdk:
    desc: Build the broad CUDA external inputs and reload direnv
    cmds:
      - nix build --impure .#zigrad-dev-cuda.externalInputs --out-link result --print-out-paths {{.CLI_ARGS}}
      - direnv reload
      - task: task_timer
        vars:
          start_time: "{{ now | unixEpoch }}"

  sdk:away:
    desc: Schedule the broad CUDA development build while away
    vars:
      MemoryMax: 50G # avoid oom kill
    cmd: |
      systemd-run --user \
        --unit=zigrad-build \
        --on-calendar='07:00' \
        --working-directory={{.TASKFILE_DIR}} \
        --property=MemoryMax={{.MemoryMax}} \
        -- bash -c 'nix build --impure --max-jobs 1 --cores 32 .#zigrad-dev-cuda > /tmp/zigrad-build.log 2>&1'
      echo "Scheduled. Status: systemctl --user status zigrad-build.timer"

  sdk:background:
    desc: Build the broad CUDA configuration with capped resources
    vars:
      CPUWeight: 50
      MemoryMax: 45G
      Nice: 5
      IOWeight: 100 # this is default btw, lower in case of issues
    cmd: |
      systemd-run --user --scope \
        --property=CPUWeight={{.CPUWeight}} \
        --property=MemoryMax={{.MemoryMax}} \
        --property=Nice={{.Nice}} \
        --property=IOWeight={{.IOWeight}} \
        -- nix build --impure --max-jobs 1 --cores 32 .#zigrad-dev-cuda

  check-sdk:
    desc: Inspect external input ELF dependencies
    cmd: nix run --impure .#check-sdk -- {{.CLI_ARGS}}
    vars:
      # default args to support overriding completely
      CLI_ARGS: --sdk-root $ZG_EXTERNAL_SDK_ROOT

  check-sdk-root:
    desc: Check the external input path used by direct development commands
    cmd: |
      if ! realpath "$ZG_EXTERNAL_SDK_ROOT" >/dev/null 2>&1; then
        printf "%bZG_EXTERNAL_SDK_ROOT=%s does not exist%b\n" \
          "{{.YELLOW}}" "$ZG_EXTERNAL_SDK_ROOT" "{{.RESET}}"
        exit 1
      fi
      printf "%bZG_EXTERNAL_SDK_ROOT=%s%b\n" \
        "{{.GREEN}}" "$ZG_EXTERNAL_SDK_ROOT" "{{.RESET}}"

  build:
    desc: Build the integration-free Zigrad package
    cmd: nix build --impure .#zigrad --out-link result-zigrad {{.CLI_ARGS}}

  test:
    desc: Run integration-free Zigrad tests
    cmd: nix build --impure .#zigrad-unit-tests --out-link result-zigrad-tests {{.CLI_ARGS}}

  cli:meta:
    desc: Build Zigrad with generated completions and manpage
    cmd: nix build --impure .#zigrad --out-link result-zigrad {{.CLI_ARGS}}

  build:xla-cpu:
    desc: Build the current XLA execution path for CPU
    cmd: nix build --impure .#zigrad-xla-cpu --out-link result-zigrad-xla-cpu {{.CLI_ARGS}}

  build:xla-cuda:
    desc: Build the current XLA execution path for CUDA
    cmd: nix build --impure .#zigrad-xla-cuda --out-link result-zigrad-xla-cuda {{.CLI_ARGS}}

  build:dev-cuda:
    desc: Build every current CUDA integration
    cmd: nix build --impure .#zigrad-dev-cuda --out-link result-zigrad-dev-cuda {{.CLI_ARGS}}

  test:dev-cuda:
    desc: Run tests with every current CUDA integration compiled
    cmd: nix build --impure .#zigrad-dev-cuda-unit-tests --out-link result-zigrad-dev-cuda-tests {{.CLI_ARGS}}

  test:tvm-runtime-gating:
    desc: Run explicit TVM runtime gating checks
    cmds:
      - nix build --impure .#zigrad-tvm-runtime-check {{.CLI_ARGS}}
      - nix build --impure .#zigrad-tvm-runtime-missing-check {{.CLI_ARGS}}

  check:flake:
    desc: Run full flake checks
    cmd: nix flake check --impure {{.CLI_ARGS}}

  op-coverage:
    desc: Print the op interface coverage matrix (what AD / format / etc each op implements)
    # `@compileLog` is a hard build failure by design - we swallow the expected
    # exit code and extract only the coverage rows from the Compile Log block.
    cmds:
      - |
        set +e
        nix develop --impure -c zig build -Demit-op-coverage=true 2>&1 \
          | sed -n '/Compile Log Output:/,/^error: the following command/p' \
          | sed -n 's/@as(\[\]const u8, "\(.*\)"\[0\.\.[0-9]*\])/\1/p; s/@as(\*const \[[0-9]*:0\]u8, "\(.*\)")/\1/p'
        exit 0

  check:tvm-runtime:host:
    desc: Check that the packaged TVM compiler can load
    cmd: nix run --impure .#zigrad-tvm-cpu -- tvm check-load {{.CLI_ARGS}}

  run:
    desc: Run the broad CUDA development configuration
    cmd: nix run --impure .#zigrad-dev-cuda -- {{.CLI_ARGS}}

  run:cpu:
    desc: Run the current XLA path with its packaged CPU PJRT plugin
    cmd: nix run --impure .#zigrad-xla-cpu -- {{.CLI_ARGS}}

  run:cpu:dump-hlo:
    vars:
      DUMP_DIR: '{{.DUMP_DIR | default "/tmp/zigrad_hlo_cpu"}}'
      CLI_ARGS: '{{.CLI_ARGS | default "demo train --warmup=1"}}'
    cmd: >-
      XLA_FLAGS="--xla_dump_to={{.DUMP_DIR}} --xla_dump_hlo_as_text --xla_dump_hlo_pass_re=.*"
      nix run --impure .#zigrad-xla-cpu -- {{.CLI_ARGS}}

  profile:cpu:
    desc: "Collect perf profile for Zigrad CPU train demo"
    deps: [build:xla-cpu]
    vars:
      PERF_DATA: '{{.PERF_DATA | default "/tmp/zigrad_perf_cpu.data"}}'
      PROFILE_ARGS: '{{.PROFILE_ARGS | default "demo train --warmup=1"}}'
      PERF_DELAY_MS: '{{.PERF_DELAY_MS | default "0"}}'
    cmds:
      - |
        nix shell --impure nixpkgs#perf -c bash -lc \
          'perf record -F 99 -g -D {{.PERF_DELAY_MS}} -o {{.PERF_DATA}} -- ./result-zigrad-xla-cpu/bin/zigrad {{.PROFILE_ARGS}} > /tmp/zigrad_perf_cpu_stdout.log 2>/tmp/zigrad_perf_cpu_stderr.log'
  profile:cpu:report:
    desc: "Report perf profile for Zigrad CPU train demo"
    vars:
      PERF_DATA: '{{.PERF_DATA | default "/tmp/zigrad_perf_cpu.data"}}'
    cmds:
      - |
        nix shell --impure nixpkgs#perf -c bash -lc \
          'perf report --stdio -n --percent-limit 1 -i {{.PERF_DATA}} | head -n 80'
  run:cuda:
    desc: Run the current XLA path with its packaged CUDA PJRT plugin
    cmd: nix run --impure .#zigrad-xla-cuda -- {{.CLI_ARGS}}

  run:cuda:dump-hlo:
    vars:
      DUMP_DIR: '{{.DUMP_DIR | default "/tmp/zigrad_hlo_cuda"}}'
      CLI_ARGS: '{{.CLI_ARGS | default "demo train --warmup=1"}}'
    cmd: >-
      XLA_FLAGS="--xla_dump_to={{.DUMP_DIR}} --xla_dump_hlo_as_text --xla_dump_hlo_pass_re=.*"
      nix run --impure .#zigrad-xla-cuda -- {{.CLI_ARGS}}

  custom-call:neg:
    cmd:
      task: run
      vars:
        CLI_ARGS: demo custom-call-negative

  custom-call:neg:cpu:
    cmd:
      task: run:cpu
      vars:
        CLI_ARGS: demo custom-call-negative

  custom-call:neg:cuda:
    cmd:
      task: run:cuda
      vars:
        CLI_ARGS: demo custom-call-negative

  vjp-demo:
    cmd:
      task: run
      vars:
        CLI_ARGS: demo vjp

  vjp-demo:cpu:
    cmd:
      task: run:cpu
      vars:
        CLI_ARGS: demo vjp

  vjp-demo:cuda:
    cmd:
      task: run:cuda
      vars:
        CLI_ARGS: demo vjp

  # IREE deployment flow ===========================================================
  iree:build:
    desc: Build the IREE CPU configuration
    cmd: nix build --impure .#zigrad-iree-cpu --out-link result-zigrad-iree-cpu {{.CLI_ARGS}}

  iree:demo:
    desc: "Run the IREE AOT compile+execute demo (all-in-one)"
    cmd: nix run --impure .#zigrad-iree-cpu -- iree demo {{.CLI_ARGS}}

  iree:compile:
    desc: "Compile serialized PR to VMFB"
    cmd: nix run --impure .#zigrad-iree-cpu -- iree compile {{.CLI_ARGS}}

  iree:runner:build:
    desc: "Build minimal IREE VMFB runner (ReleaseSmall)"
    cmd:
      task: iree:build

  iree:runner:run:
    desc: "Execute a VMFB with the IREE runner"
    deps: [iree:runner:build]
    cmd: ./result-zigrad-iree-cpu/bin/iree-runner {{.CLI_ARGS}}

  # Shim (MLIR dialect/pass development) ======================================
  shim:build:
    desc: Rebuild the MLIR extension shim locally (auto-configures on first run)
    cmd: |
      if [ ! -f shim/build/build.ninja ]; then
        cmake -G Ninja -S shim -B shim/build \
          -DZG_SDK_INCLUDE=$ZG_EXTERNAL_SDK_ROOT/include \
          -DZG_SDK_LIB=$ZG_EXTERNAL_SDK_ROOT/lib
      fi
      cmake --build shim/build

  shim:test:
    desc: Run all MLIR pass tests via mlir-opt
    deps: [shim:build]
    cmd: |
      ZG_EXT=shim/build/libzigrad_mlir_ext.so
      MLIR_OPT=result-llvm/bin/mlir-opt
      PLUGIN="--load-dialect-plugin=$ZG_EXT --load-pass-plugin=$ZG_EXT"
      failed=0
      for f in shim/test/select_*.mlir; do
        echo "=== $f ==="
        $MLIR_OPT $PLUGIN --pass-pipeline="builtin.module(func.func(zg-mirage-kernel-select))" "$f" || failed=1
      done
      for f in shim/test/legalize*.mlir shim/test/expand_*.mlir; do
        [ -f "$f" ] || continue
        pass=$(head -1 "$f" | sed -n 's|^// RUN-PIPELINE: ||p')
        [ -n "$pass" ] || continue
        echo "=== $f ==="
        $MLIR_OPT $PLUGIN --pass-pipeline="$pass" "$f" || failed=1
      done
      exit $failed

  shim:opt:
    desc: "Run mlir-opt with zigrad plugin. Usage: task shim:opt -- --pass-pipeline='...' file.mlir"
    cmd: |
      result-llvm/bin/mlir-opt \
        --load-dialect-plugin=shim/build/libzigrad_mlir_ext.so \
        --load-pass-plugin=shim/build/libzigrad_mlir_ext.so \
        {{.CLI_ARGS}}

  # Nix ccache -----------------------------------------------------------------
  nix-ccache-setup:
    cmds:
      - sudo mkdir -m0770 -p /nix/var/cache/ccache
      - sudo chown --reference=/nix/store /nix/var/cache/ccache
      - task: _nix-cache-setup
        vars:
          path: /nix/var/cache/ccache

  nix-ccache:
    cmd: sudo "$(command -v nix)" run --impure .#ccache -- --dir /nix/var/cache/ccache {{.CLI_ARGS}}

  nix-ccache:increase-size:
    cmd:
      task: nix-ccache
      vars:
        CLI_ARGS: --max-size 50G

  nix-ccache:stats:
    cmd:
      task: nix-ccache
      vars:
        CLI_ARGS: --show-stats

  nix-ccache:bundle:
    cmd: |
      sudo tar \
        --numeric-owner \
        --xattrs --acls \
        --exclude='./tmp' \
        --exclude='./lock' \
        -C /nix/var/cache \
        -czf /tmp/ccache-seed.tgz ccache

  nix-ccache:populate:
    cmds:
      - sudo mkdir -p /nix/var/cache/ccache
      - sudo tar --numeric-owner --xattrs --acls -C /nix/var/cache -xzf ccache-seed.tgz

  _nix-cache-setup:
    internal: true
    cmd: |
      file=/etc/nix/nix.custom.conf
      path="{{.path}}"
      line="extra-sandbox-paths = $path"

      # ensure file exists
      sudo touch "$file"

      before=$(sha256sum "$file" | cut -d' ' -f1)

      # append only if the path is not already present on any extra-sandbox-paths line
      if ! grep -Eq '^[[:space:]]*extra-sandbox-paths[[:space:]]*=.*(^|[[:space:]])'"$path"'([[:space:]]|$)' "$file"; then
        echo "$line" | sudo tee -a "$file" >/dev/null
      fi

      after=$(sha256sum "$file" | cut -d' ' -f1)

      if [ "$before" != "$after" ]; then
        echo "nix conf changed, restart daemon."
      fi

  # Nix bazel cache ------------------------------------------------------------
  nix-bazel-cache-setup:
    cmds:
      - sudo mkdir -m0770 -p /nix/var/cache/bazel
      - sudo chown --reference=/nix/store /nix/var/cache/bazel
      - task: _nix-cache-setup
        vars:
          path: /nix/var/cache/bazel

  nix-bazel-cache:usage:
    cmd: sudo du -sh /nix/var/cache/bazel

  # Rsync ----------------------------------------------------------------------
  sync:push:
    desc: "Sync local -> remote (no deletes)"
    cmds:
      - |
        {{.RSYNC_BASE}} {{.CLI_ARGS}} --progress ./ {{.REMOTE}}/
    requires:
      vars: [REMOTE]

  sync:pull:
    desc: "Sync remote -> local (no deletes)"
    cmds:
      - |
        {{.RSYNC_BASE}} {{.CLI_ARGS}} --progress {{.REMOTE}}:/ ./
    requires:
      vars: [REMOTE]

  sync:push:mirror:
    desc: "Mirror local -> remote (DELETES remote files)"
    cmds:
      - |
        {{.RSYNC_BASE}} {{.CLI_ARGS}} --progress --delete ./ {{.REMOTE}}/
    requires:
      vars: [REMOTE]

  sync:push:dry:
    desc: "Dry-run local -> remote (optional verbose output)"
    vars:
      VERBOSE: '{{.VERBOSE | default "off"}}'
      RSYNC_VERBOSE_FLAGS: >-
        {{if eq .VERBOSE "on"}}--itemize-changes --human-readable{{end}}
    requires:
      vars:
        - REMOTE
        - name: VERBOSE
          enum: [off, on]
    cmds:
      - |
        {{.RSYNC_BASE}} --dry-run {{.RSYNC_VERBOSE_FLAGS}} ./ {{.REMOTE}}/

  sync:pull:dry:
    desc: "Dry-run remote -> local (optional verbose output)"
    vars:
      VERBOSE: '{{.VERBOSE | default "off"}}'
      RSYNC_VERBOSE_FLAGS: >-
        {{if eq .VERBOSE "on"}}--itemize-changes --human-readable{{end}}
    requires:
      vars:
        - REMOTE
        - name: VERBOSE
          enum: [off, on]
    cmds:
      - |
        {{.RSYNC_BASE}} --dry-run {{.RSYNC_VERBOSE_FLAGS}}  {{.REMOTE}}:/ ./

  bench-grid:
    desc: Tune and compare the maintained matmul benchmark implementations
    deps: [check-sdk-root]
    dir: examples/benchmark
    cmds:
      - | # GPU
        shape0=1024x1024x1024
        shape1=32768x1024x1024
        zig build -Dsdk="$ZG_EXTERNAL_SDK_ROOT" run -- \
          tune --shapes=$shape0,$shape1 --impls=tvm_gpu
        zig build -Dsdk="$ZG_EXTERNAL_SDK_ROOT" run -- \
          --shapes=$shape0,$shape1 --impls=tvm_gpu,xla_gpu
      - | # CPU
        shape0=1024x1024x1024
        shape1=32768x1024x1024
        zig build -Dsdk="$ZG_EXTERNAL_SDK_ROOT" run -- \
          tune --shapes=$shape0,$shape1 --impls=tvm_cpu
        zig build -Dsdk="$ZG_EXTERNAL_SDK_ROOT" run -- \
          --shapes=$shape0,$shape1 --impls=tvm_cpu,xla_cpu

  mnist:
    dir: examples/mnist/
    cmds:
      - zig build run
