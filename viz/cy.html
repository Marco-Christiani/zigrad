<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://unpkg.com/cytoscape@3.27.0/dist/cytoscape.min.js"></script>


  <!-- dagre library -->
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>

  <!-- cytoscape-dagre plugin -->
  <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>

  <style>
    body { margin: 0; background: #111; }
    #cy { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="cy"></div>

  <script>
    cytoscape.use(cytoscapeDagre);
    const graphData = {
      nodes: [
        { id: "input_ids" },
        { id: "pos_emb" },
        { id: "token_emb" },
        { id: "embed_add" },

        { id: "ln1" },
        { id: "q_proj" },
        { id: "k_proj" },
        { id: "v_proj" },
        { id: "attention" },
        { id: "attn_out" },
        { id: "residual1" },

        { id: "ln2" },
        { id: "ffn1" },
        { id: "ffn2" },
        { id: "residual2" },

        { id: "classifier" },
        { id: "softmax" }
      ],
      edges: [
        // Embedding path
        { source: "input_ids", target: "token_emb" },
        { source: "token_emb", target: "embed_add" },
        { source: "pos_emb", target: "embed_add" },

        // Attention block
        { source: "embed_add", target: "ln1" },
        { source: "ln1", target: "q_proj" },
        { source: "ln1", target: "k_proj" },
        { source: "ln1", target: "v_proj" },

        { source: "q_proj", target: "attention" },
        { source: "k_proj", target: "attention" },
        { source: "v_proj", target: "attention" },

        { source: "attention", target: "attn_out" },
        { source: "attn_out", target: "residual1" },
        { source: "embed_add", target: "residual1" },

        // FFN block
        { source: "residual1", target: "ln2" },
        { source: "ln2", target: "ffn1" },
        { source: "ffn1", target: "ffn2" },

        { source: "ffn2", target: "residual2" },
        { source: "residual1", target: "residual2" },

        // Output
        { source: "residual2", target: "classifier" },
        { source: "classifier", target: "softmax" }
      ]
    };

    cytoscape({
      container: document.getElementById('cy'),
      elements: [
        ...graphData.nodes.map(n => ({ data: { id: n.id } })),
        ...graphData.edges.map(e => ({ data: e }))
      ],
      layout: {
        name: 'dagre'
        // name: 'breadthfirst',
        // directed: true,
        // spacingFactor: 1.5,
        // padding: 20
      },
      style: [
        {
          selector: 'node',
          style: {
            'background-color': '#4cc9f0',
            'label': 'data(id)',
            // 'color': '#ffffff',
            'text-valign': 'center',
            'text-halign': 'center',
            // 'font-size': '10px',
            'width': 'label',
            'height': 'label',
            // 'padding': '8px',
            'shape': 'round-rectangle'
          }
        },
        {
          selector: 'edge',
          style: {
            'width': 2,
            'line-color': '#888',
            'target-arrow-color': '#888',
            'target-arrow-shape': 'triangle',
            'curve-style': 'bezier'
          }
        }
      ]
    });
  </script>
</body>
</html>
