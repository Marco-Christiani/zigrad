<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Zigrad PR Viewer</title>
  <script src="https://unpkg.com/cytoscape@3.27.0/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111; font-family: monospace; color: #eee; }
    #container { display: flex; height: 100vh; }
    #cy { flex: 1; order: 2; }
    #sidebar {
      width: 520px;
      min-width: 520px;
      order: 1;
      background: #1a1a1a;
      border-right: 1px solid #333;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h2 { margin: 0; color: #4cc9f0; font-size: 14px; }
    .section { background: #0a1a2a; padding: 10px; border-radius: 4px; border: 1px solid #333; }
    .stat { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; }
    .stat-label { color: #888; }
    .stat-value { color: #4cc9f0; font-weight: bold; }
    #detail { font-size: 11px; white-space: pre-wrap; word-break: break-all; }
    #detail .key { color: #888; }
    #detail .val { color: #eee; }
    #detail .dtype { color: #d3869b; }
    #detail .shape { color: #4cc9f0; }
    .file-input { margin-bottom: 8px; }
    .file-input label {
      display: block; padding: 8px; background: #0a5a7a; border: 1px solid #0a7a9a;
      border-radius: 4px; text-align: center; cursor: pointer; font-family: monospace; color: #fff;
    }
    .file-input label:hover { background: #0a7a9a; }
    .file-input input { display: none; }
    #drop-zone {
      border: 2px dashed #333; border-radius: 4px; padding: 12px;
      text-align: center; color: #555; font-size: 11px; transition: all 0.2s;
    }
    #drop-zone.drag-over { border-color: #4cc9f0; color: #4cc9f0; }
    .region-tag {
      display: inline-block; padding: 2px 6px; border-radius: 3px;
      font-size: 10px; margin: 2px; background: #1a3a5a; color: #7dcfff;
    }
    .zxpr-block {
      background: #0d0d0d; border: 1px solid #333; border-radius: 4px;
      padding: 8px; margin-top: 6px; font-size: 11px; line-height: 1.5;
      color: #d4be98; white-space: pre; overflow-x: auto;
      margin-left: -10px; margin-right: -10px;
    }
    .zxpr-label { color: #888; font-size: 10px; margin-top: 8px; display: block; }
  </style>
</head>
<body>
  <div id="container">
    <div id="cy"></div>
    <div id="sidebar">
      <h2>Zigrad PR Viewer</h2>

      <div class="file-input">
        <label for="file-picker">Load graph.json</label>
        <input type="file" id="file-picker" accept=".json">
      </div>
      <div id="drop-zone">or drop graph.json here</div>

      <div class="section">
        <div class="stat">
          <span class="stat-label">Function:</span>
          <span class="stat-value" id="stat-name">-</span>
        </div>
        <div class="stat">
          <span class="stat-label">Ops:</span>
          <span class="stat-value" id="stat-nodes">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Vars:</span>
          <span class="stat-value" id="stat-edges">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Regions:</span>
          <span class="stat-value" id="stat-regions">0</span>
        </div>
      </div>

      <h2>Detail</h2>
      <div class="section" id="detail">
        Click a node or edge to inspect
      </div>
    </div>
  </div>

  <script>
    cytoscape.use(cytoscapeDagre);

    // Op category colors
    const OP_COLORS = {
      param:            '#7dcfff',
      // elementwise
      add:              '#a9b665',
      subtract:         '#a9b665',
      multiply:         '#a9b665',
      divide:           '#a9b665',
      maximum:          '#a9b665',
      // unary
      exp:              '#89b482',
      log:              '#89b482',
      rsqrt:            '#89b482',
      logistic:         '#89b482',
      convert:          '#89b482',
      // contraction
      dot:              '#d8a657',
      dot_general:      '#d8a657',
      // shape
      reshape:          '#d3869b',
      transpose:        '#d3869b',
      broadcast_in_dim: '#d3869b',
      slice:            '#d3869b',
      concatenate:      '#d3869b',
      iota:             '#d3869b',
      // reduction
      reduce_sum:       '#e78a4e',
      reduce_max:       '#e78a4e',
      // comparison
      compare:          '#83a598',
      select:           '#83a598',
      // special
      literal:          '#928374',
      gather:           '#fabd2f',
      scatter:          '#fabd2f',
      call:             '#fb4934',
      custom_call:      '#fb4934',
    };

    const DEFAULT_COLOR = '#4cc9f0';

    function colorForKind(kind) {
      return OP_COLORS[kind] || DEFAULT_COLOR;
    }

    // Shape string: [2, 3] -> "2x3"
    function shapeStr(shape) {
      if (!shape || shape.length === 0) return 'scalar';
      return shape.join('x');
    }

    let cy = null;
    let graphData = null;

    function initCy() {
      cy = cytoscape({
        container: document.getElementById('cy'),
        elements: [],
        layout: { name: 'dagre', rankDir: 'TB', nodeSep: 50, rankSep: 80 },
        style: [
          {
            selector: 'node[label]',
            style: {
              'background-color': 'data(color)',
              'label': 'data(label)',
              'color': '#111',
              'text-valign': 'center',
              'text-halign': 'center',
              'shape': 'round-rectangle',
              'width': 'label',
              'height': 'label',
              'padding': '8px',
              'font-size': '11px',
              'font-weight': 'bold',
              'font-family': 'monospace',
            }
          },
          {
            selector: 'node[kind = "param"]',
            style: {
              'shape': 'ellipse',
              'padding': '10px',
            }
          },
          {
            selector: 'edge',
            style: {
              'width': 2,
              'line-color': '#666',
              'target-arrow-color': '#888',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'label': 'data(edgeLabel)',
              'font-size': '9px',
              'color': '#aaa',
              'text-rotation': 'autorotate',
              'text-margin-y': -8,
            }
          },
          {
            selector: 'edge:selected',
            style: { 'width': 4, 'line-color': '#ff6b6b', 'target-arrow-color': '#ff6b6b' }
          },
          {
            selector: 'node:selected',
            style: { 'border-width': 3, 'border-color': '#ff6b6b' }
          },
          {
            selector: ':parent',
            style: {
              'background-opacity': 0.1,
              'background-color': '#7dcfff',
              'border-width': 1,
              'border-color': '#7dcfff',
              'border-opacity': 0.4,
              'label': 'data(regionName)',
              'text-valign': 'top',
              'text-halign': 'center',
              'color': '#7dcfff',
              'font-size': '10px',
              'padding': '12px',
            }
          },
        ]
      });

      cy.on('tap', 'node', (e) => showNodeDetail(e.target.data()));
      cy.on('tap', 'edge', (e) => showEdgeDetail(e.target.data()));
      cy.on('tap', (e) => { if (e.target === cy) clearDetail(); });
    }

    function loadGraph(data) {
      // Handle array (multi-function) — show first
      if (Array.isArray(data)) {
        data = data[0];
      }
      graphData = data;

      const elements = [];

      // Build region membership: op node id -> region compound node id
      const regionParent = new Map();
      if (data.regions) {
        for (const [ri, region] of data.regions.entries()) {
          const regionId = `__region_${ri}`;
          elements.push({
            data: {
              id: regionId,
              regionName: `${region.name}${region.kernelize ? ' [' + region.kernelize + ']' : ''}`,
              kind: 'region',
              name: region.name,
              kernelize: region.kernelize || null,
              outline: region.outline || false,
              zxpr: region.zxpr || null,
            }
          });
          for (const nid of region.node_ids) {
            regionParent.set(nid, regionId);
          }
        }
      }

      // Nodes = ops. Label comes from JSON (var_name for params, "var = prim" for eqns).
      for (const n of data.nodes) {
        const nodeData = { ...n };
        const parent = regionParent.get(n.id);
        if (parent) nodeData.parent = parent;
        nodeData.color = colorForKind(n.kind);
        elements.push({ data: nodeData });
      }

      // Edges = vars. Label shows "var_name: shape<dtype>".
      for (const e of data.edges) {
        let elabel = e.var || '';
        if (e.shape) {
          elabel += `: ${shapeStr(e.shape)}<${e.dtype}>`;
        }
        elements.push({
          data: {
            source: e.source,
            target: e.target,
            port: e.port,
            varName: e.var,
            dtype: e.dtype,
            shape: e.shape,
            edgeLabel: elabel,
          }
        });
      }

      cy.elements().remove();
      cy.add(elements);
      cy.layout({ name: 'dagre', rankDir: 'TB', nodeSep: 50, rankSep: 80 }).run();

      // Stats
      document.getElementById('stat-name').textContent = data.name || '-';
      document.getElementById('stat-nodes').textContent = data.nodes.length;
      document.getElementById('stat-edges').textContent = data.edges.length;
      document.getElementById('stat-regions').textContent = (data.regions || []).length;
    }

    function showNodeDetail(d) {
      let html = '';

      if (d.kind === 'region') {
        html += `<span class="key">region:</span> <span class="val">${d.name}</span>\n`;
        if (d.kernelize) html += `<span class="key">kernelize:</span> <span class="val">${d.kernelize}</span>\n`;
        if (d.outline) html += `<span class="key">outline:</span> <span class="val">yes</span>\n`;
      } else {
        html += `<span class="key">op:</span> <span class="val">${d.kind}</span>\n`;
        if (d.label) html += `<span class="key">label:</span> <span class="val">${d.label}</span>\n`;
        if (d.vjp) html += `<span class="key">vjp:</span> <span class="val">yes</span>\n`;
        if (d.attrs) {
          html += `<span class="key">attrs:</span>\n`;
          for (const [k, v] of Object.entries(d.attrs)) {
            const vs = Array.isArray(v) ? `[${v.join(', ')}]` : JSON.stringify(v);
            html += `  <span class="key">${k}:</span> <span class="val">${vs}</span>\n`;
          }
        }
      }

      if (d.zxpr) {
        html += `<span class="zxpr-label">zxpr</span>`;
        html += `<div class="zxpr-block">${escapeHtml(d.zxpr)}</div>`;
      }

      document.getElementById('detail').innerHTML = html;
    }

    function showEdgeDetail(d) {
      let html = '';
      html += `<span class="key">var:</span> <span class="val">${d.varName || '?'}</span>\n`;
      if (d.dtype) html += `<span class="key">dtype:</span> <span class="dtype">${d.dtype}</span>\n`;
      if (d.shape) html += `<span class="key">shape:</span> <span class="shape">[${d.shape.join(', ')}]</span>\n`;
      html += `<span class="key">port:</span> <span class="val">${d.port}</span>\n`;
      html += `<span class="key">source:</span> <span class="val">${d.source}</span>\n`;
      html += `<span class="key">target:</span> <span class="val">${d.target}</span>\n`;
      document.getElementById('detail').innerHTML = html;
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function clearDetail() {
      document.getElementById('detail').textContent = 'Click a node or edge to inspect';
    }

    // File loading
    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          loadGraph(data);
        } catch (err) {
          alert('Invalid JSON: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    document.getElementById('file-picker').addEventListener('change', (e) => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });

    const dropZone = document.getElementById('drop-zone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    // Try loading graph.json from same directory on startup
    initCy();
    fetch('graph.json')
      .then(r => { if (r.ok) return r.json(); throw new Error('not found'); })
      .then(data => loadGraph(data))
      .catch(() => {}); // No default file — user will load manually
  </script>
</body>
</html>
